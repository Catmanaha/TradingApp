name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore TradingApp/TradingApp.csproj

      - name: Restore tests
        run: dotnet restore tests/TradingApp.Tests/TradingApp.Tests.csproj

      - name: Build
        run: dotnet build TradingApp/TradingApp.csproj --configuration Release --no-restore

      - name: Build tests
        run: dotnet build tests/TradingApp.Tests/TradingApp.Tests.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/TradingApp.Tests/TradingApp.Tests.csproj --configuration Release --no-restore --no-build

      - name: Check vulnerable packages
        run: dotnet list TradingApp/TradingApp.csproj package --vulnerable --include-transitive

      - name: Check test packages
        run: dotnet list tests/TradingApp.Tests/TradingApp.Tests.csproj package --vulnerable --include-transitive
